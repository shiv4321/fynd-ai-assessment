<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Your Review</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Share Your Experience</h1>
            <p>We value your feedback and want to hear about your experience</p>
        </header>

        <main>
            <div class="review-form" id="reviewForm">
                <div class="form-group">
                    <label for="rating">How would you rate your experience?</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5">
                        <label for="star5" title="5 stars">★</label>
                        
                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4" title="4 stars">★</label>
                        
                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3" title="3 stars">★</label>
                        
                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2" title="2 stars">★</label>
                        
                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1" title="1 star">★</label>
                    </div>
                    <p class="rating-text" id="ratingText">Select a rating</p>
                </div>

                <div class="form-group">
                    <label for="review">Tell us more about your experience</label>
                    <textarea 
                        id="review" 
                        name="review" 
                        rows="6" 
                        placeholder="Share your thoughts..."
                        maxlength="2000"
                    ></textarea>
                    <p class="char-count"><span id="charCount">0</span>/2000 characters</p>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    Submit Review
                </button>
            </div>

            <div class="response-container" id="responseContainer" style="display: none;">
                <div class="response-box">
                    <h2>Thank you for your feedback!</h2>
                    <div id="aiResponse" class="ai-response"></div>
                    <button id="submitAnother" class="secondary-btn">Submit Another Review</button>
                </div>
            </div>

            <div class="error-container" id="errorContainer" style="display: none;">
                <div class="error-box">
                    <h2>Oops! Something went wrong</h2>
                    <p id="errorMessage"></p>
                    <button id="tryAgain" class="secondary-btn">Try Again</button>
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Processing your review...</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
