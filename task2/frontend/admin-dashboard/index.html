<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Review Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>📊 Review Management Dashboard</h1>
            <div class="header-actions">
                <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
            </div>
        </header>

        <div class="analytics-section">
            <div class="stat-card">
                <div class="stat-icon">📝</div>
                <div class="stat-content">
                    <h3>Total Reviews</h3>
                    <p class="stat-value" id="totalReviews">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-content">
                    <h3>Average Rating</h3>
                    <p class="stat-value" id="avgRating">0.0</p>
                </div>
            </div>

            <div class="stat-card distribution-card">
                <div class="stat-content">
                    <h3>Rating Distribution</h3>
                    <div class="rating-bars" id="ratingBars">
                        <div class="rating-bar">
                            <span class="rating-label">5⭐</span>
                            <div class="bar-container">
                                <div class="bar" data-rating="5" style="width: 0%"></div>
                            </div>
                            <span class="rating-count" id="count5">0</span>
                        </div>
                        <div class="rating-bar">
                            <span class="rating-label">4⭐</span>
                            <div class="bar-container">
                                <div class="bar" data-rating="4" style="width: 0%"></div>
                            </div>
                            <span class="rating-count" id="count4">0</span>
                        </div>
                        <div class="rating-bar">
                            <span class="rating-label">3⭐</span>
                            <div class="bar-container">
                                <div class="bar" data-rating="3" style="width: 0%"></div>
                            </div>
                            <span class="rating-count" id="count3">0</span>
                        </div>
                        <div class="rating-bar">
                            <span class="rating-label">2⭐</span>
                            <div class="bar-container">
                                <div class="bar" data-rating="2" style="width: 0%"></div>
                            </div>
                            <span class="rating-count" id="count2">0</span>
                        </div>
                        <div class="rating-bar">
                            <span class="rating-label">1⭐</span>
                            <div class="bar-container">
                                <div class="bar" data-rating="1" style="width: 0%"></div>
                            </div>
                            <span class="rating-count" id="count1">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="filters-section">
            <h3>Filter by Rating</h3>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="5">5⭐</button>
                <button class="filter-btn" data-filter="4">4⭐</button>
                <button class="filter-btn" data-filter="3">3⭐</button>
                <button class="filter-btn" data-filter="2">2⭐</button>
                <button class="filter-btn" data-filter="1">1⭐</button>
            </div>
        </div>

        <div class="submissions-section">
            <h2>Recent Submissions</h2>
            <div id="submissionsContainer" class="submissions-container">
                <!-- Submissions will be loaded here -->
            </div>
            
            <div id="emptyState" class="empty-state">
                <p>📭 No submissions yet</p>
                <p class="empty-subtitle">Submissions will appear here when users submit reviews</p>
            </div>

            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>Loading submissions...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
